  note: >-
    Submitted via apis.io/add on 2026-08-24 and auto-published by the gate at rating 48. The
    submitted APIs.json at https://www.sagaris.ai/apis.json returns 404 against a control that
    also 404s, so it is a bad pointer rather than an absent surface.
    A 26KB llms.txt IS served and is kept here. On a first probe it returned 503; a later request
    returned 200, so that was transient and not a block — worth noting before anyone reads a
    single 503 as a dead host.
    apis[] IS EMPTY ON PURPOSE. No OpenAPI was found: /openapi.json and /apis.json both return
    real 404s, and the llms.txt — which is long and carefully written — names no machine-readable
    specification anywhere in it. SAGARIS describes an MCP server at /mcp, but that URL serves a
    marketing page rather than a protocol endpoint, and probes of /api/mcp, /mcp/sse and
    mcp.sagaris.ai found nothing. The MCPServer pointer therefore records what the provider
    CLAIMS, not a verified endpoint. Nothing was modelled to fill the gap.
