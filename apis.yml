aid: sagaris
name: SAGARIS
description: >-
  SAGARIS is an agentic revenue operating system for B2B sales teams — CRM, dialer, inbox, SMS,
  social, an AI receptionist and an AI coach in one system, where AI agents act on the pipeline
  under approval gates and an audit trail rather than only reporting on it. Pricing is public at
  499 USD per founding seat per month, with a custom Enterprise plan. SAGARIS describes a Model
  Context Protocol endpoint that lets an AI client read the CRM, sequences and workspace with a
  workspace API key, read-only and scoped to the workspace.
